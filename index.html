<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Pi 4 Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid #334155;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .status-badge {
            font-size: 0.85rem;
            padding: 6px 12px;
            border-radius: 20px;
            background-color: #334155;
            color: var(--text-sub);
        }

        .status-badge.online {
            background-color: rgba(34, 197, 94, 0.2);
            color: var(--accent-green);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 2px solid transparent;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .card-title {
            font-size: 1rem;
            color: var(--text-sub);
            font-weight: 500;
        }

        .card-value {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .card-btn {
            cursor: pointer;
        }

        .card-btn:active {
            transform: scale(0.97);
        }

        .card-btn.active {
            border-color: var(--accent-blue);
            background-color: #1e3a8a;
        }

        .card-motion.detected {
            border-color: var(--accent-red);
            background-color: rgba(239, 68, 68, 0.15);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        /* Элемент выбора цвета */
        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
        }

        input[type="color"] {
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            background: none;
        }

        .ha-banner {
            background-color: #0284c7;
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        .log-container {
            background-color: #090d16;
            border-radius: 12px;
            padding: 12px;
            font-family: monospace;
            font-size: 0.8rem;
            color: #38edf8;
            height: 100px;
            overflow-y: auto;
            border: 1px solid #1e293b;
        }
    </style>
</head>
<body>

    <header>
        <h1>Smart Home Dashboard</h1>
        <div id="ws-status" class="status-badge">Connecting...</div>
    </header>

    <main class="dashboard-grid">
        <!-- Температура -->
        <div class="card">
            <div class="card-header">
                <span class="card-title">Temperature</span>
                <span>🌡️</span>
            </div>
            <div class="card-value" id="val-temp">-- °C</div>
        </div>

        <!-- Движение -->
        <div class="card card-motion" id="card-motion" onclick="triggerMotionSimulation()">
            <div class="card-header">
                <span class="card-title">Motion Sensor</span>
                <span>🏃</span>
            </div>
            <div class="card-value" id="val-motion">No Motion</div>
        </div>

        <!-- Лампа 1 -->
        <div class="card card-btn" id="btn-lamp1" onclick="sendCommand('TOGGLE_LAMP_1')">
            <div class="card-header">
                <span class="card-title">Lamp 1</span>
                <span>💡</span>
            </div>
            <div class="card-value" id="val-lamp1">OFF</div>
        </div>

        <!-- Лампа 2 -->
        <div class="card card-btn" id="btn-lamp2" onclick="sendCommand('TOGGLE_LAMP_2')">
            <div class="card-header">
                <span class="card-title">Lamp 2</span>
                <span>💡</span>
            </div>
            <div class="card-value" id="val-lamp2">OFF</div>
        </div>

        <!-- Вентилятор -->
        <div class="card card-btn" id="btn-fan" onclick="sendCommand('TOGGLE_FAN')">
            <div class="card-header">
                <span class="card-title">Fan Control</span>
                <span>🌀</span>
            </div>
            <div class="card-value" id="val-fan">OFF</div>
        </div>

        <!-- RGB Подсветка стенда -->
        <div class="card card-btn" id="card-rgb">
            <div class="card-header" onclick="sendCommand('TOGGLE_RGB')">
                <span class="card-title">RGB Backlight</span>
                <span>🌈</span>
            </div>
            <div class="card-value" id="val-rgb" onclick="sendCommand('TOGGLE_RGB')">OFF</div>
            <div class="color-picker-wrapper">
                <span style="font-size: 0.8rem; color: var(--text-sub);">Color:</span>
                <input type="color" id="colorPicker" value="#ff0000" onchange="changeRgbColor(event)" onclick="event.stopPropagation()">
            </div>
        </div>
    </main>

    <div class="ha-banner">
        <span><strong>HA Bridge:</strong> Connected to Local Bus</span>
        <span id="ha-status">Ready</span>
    </div>

    <div class="log-container" id="log-window">
        [System Initialization] Ready with RGB support...
    </div>

    <script>
        let ws;
        const logWin = document.getElementById('log-window');

        function addLog(msg) {
            const time = new Date().toLocaleTimeString();
            logWin.innerHTML += `<br>[${time}] ${msg}`;
            logWin.scrollTop = logWin.scrollHeight;
        }

        function connectWS() {
            const host = window.location.host;
            ws = new WebSocket(`ws://${host}`);

            ws.onopen = () => {
                const statusEl = document.getElementById('ws-status');
                statusEl.innerText = "System Online";
                statusEl.classList.add("online");
                addLog("Connected to WebSocket server.");
            };

            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                if (msg.type === 'STATE_UPDATE') {
                    updateUI(msg.payload);
                }
            };

            ws.onclose = () => {
                const statusEl = document.getElementById('ws-status');
                statusEl.innerText = "Disconnected";
                statusEl.classList.remove("online");
                addLog("WebSocket connection lost. Reconnecting in 3s...");
                setTimeout(connectWS, 3000);
            };
        }

        function updateUI(state) {
            document.getElementById('val-temp').innerText = `${state.temperature} °C`;

            const motionCard = document.getElementById('card-motion');
            const motionVal = document.getElementById('val-motion');
            if (state.motion) {
                motionCard.classList.add('detected');
                motionVal.innerText = "Motion Detected!";
            } else {
                motionCard.classList.remove('detected');
                motionVal.innerText = "No Motion";
            }

            updateDeviceBtn('btn-lamp1', 'val-lamp1', state.lamp1);
            updateDeviceBtn('btn-lamp2', 'val-lamp2', state.lamp2);
            updateDeviceBtn('btn-fan', 'val-fan', state.fan);

            // Обновление состояния RGB карточки
            updateDeviceBtn('card-rgb', 'val-rgb', state.rgbPower);
            document.getElementById('colorPicker').value = state.rgbColor;
        }

        function updateDeviceBtn(btnId, valId, isOn) {
            const btn = document.getElementById(btnId);
            const val = document.getElementById(valId);
            if (isOn) {
                btn.classList.add('active');
                val.innerText = "ON";
            } else {
                btn.classList.remove('active');
                val.innerText = "OFF";
            }
        }

        function sendCommand(actionName) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ action: actionName }));
                addLog(`Action sent: ${actionName}`);
            }
        }

        function changeRgbColor(event) {
            const colorHex = event.target.value;
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ action: 'SET_RGB_COLOR', color: colorHex }));
                addLog(`RGB Color changed to: ${colorHex}`);
            }
        }

        function triggerMotionSimulation() {
            sendCommand('TRIGGER_MOTION');
        }

        connectWS();
    </script>
</body>
</html>
